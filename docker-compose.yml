services:
  dgsmgt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgsmgt
    restart: always
    depends_on:
      - docker-proxy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - db_data:/app/data
      - docker_api:/run/dgsmgt
    environment:
      - DATABASE_URL=/app/data/dgsmgt.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - DOCKER_PROXY_SOCKET=/run/dgsmgt/docker-proxy.sock
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  docker-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./dgsmgt-docker-proxy"]
    restart: always
    network_mode: none
    user: "0:0"
    environment:
      - DOCKER_PROXY_SOCKET=/run/dgsmgt/docker-proxy.sock
      - ALLOWED_IMAGES=${ALLOWED_IMAGES:-}
      - ALLOWED_VOLUME_ROOTS=${ALLOWED_VOLUME_ROOTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker_api:/run/dgsmgt
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

volumes:
  db_data:
  docker_api:
