services:
  postgres:
    image: postgres:17-alpine
    container_name: dgsmgt-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-dgsmgt}
      # No insecure fallbacks: compose fails fast unless secrets are provided.
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-dgsmgt}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dgsmgt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dgsmgt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dgsmgt
    restart: always
    # Lets the panel reach published game ports (auto-configured RCON) on
    # Linux hosts; Docker Desktop provides this alias natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - backup_data:/app/backups
      - log_data:/app/serverlogs
      # Must be the SAME absolute path inside the container and on the host:
      # volume binds for game servers are resolved by the host Docker daemon.
      - ${SERVER_DATA_PATH:-/opt/dgsmgt/serverdata}:${SERVER_DATA_PATH:-/opt/dgsmgt/serverdata}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=host=postgres user=${DB_USER:-dgsmgt} password=${DB_PASSWORD:?set DB_PASSWORD} dbname=${DB_NAME:-dgsmgt} port=5432 sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET to a long random string}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      # Game server deployment
      - SERVER_GAME_PORTRANGE=${SERVER_GAME_PORTRANGE:-25000-30000}
      - SERVER_DATA_PATH=${SERVER_DATA_PATH:-/opt/dgsmgt/serverdata}
      - RCON_HOST=${RCON_HOST:-host.docker.internal}
      # Auth (optional)
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-720h}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URL=${DISCORD_REDIRECT_URL:-}
      - DISCORD_AUTO_CREATE=${DISCORD_AUTO_CREATE:-false}
      # SMTP (optional, for password reset + email notifications)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-dgsmgt@localhost}
      # Backup targets (optional)
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_USER=${SFTP_USER:-}
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
  backup_data:
  log_data:
