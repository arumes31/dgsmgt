<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration | DGSMgt</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/app2.css">
</head>
<body>
<div class="mesh-bg"></div>
<div class="layout">
  <aside class="sidebar">
    <h2 class="text-gradient" style="font-size:22px;margin-bottom:32px">⚡ DGSMgt</h2>
    <nav style="display:flex;flex-direction:column;gap:6px" id="nav">
      <a class="btn btn-outline" style="justify-content:flex-start" href="/dashboard.html">🖥️ Servers</a>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="overview">📊 Overview</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="servers">🗄️ Manage servers</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="users">👥 Users</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="groups">🏷️ Groups</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="access">🔐 Access</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="audit">📜 Audit log</button>
      <button class="btn btn-outline" style="justify-content:flex-start" data-sec="trash">🗑️ Trash</button>
      <button class="btn btn-outline hidden" style="justify-content:flex-start" data-sec="nodes" id="nav-nodes">🖧 Nodes</button>
      <button class="btn btn-outline hidden" style="justify-content:flex-start" data-sec="settings" id="nav-settings">⚙️ Settings</button>
    </nav>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <div class="flex">
        <button class="btn btn-outline btn-icon" onclick="App.toggleTheme()">🌓</button>
        <span id="bell-mount"></span>
      </div>
      <button class="btn btn-outline" onclick="App.logout()">Logout</button>
    </div>
  </aside>
  <main class="main-content" id="main"><div id="content"></div></main>
</div>
<div class="drawer glass" id="drawer"></div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/admin-servers.js"></script>
<script src="/js/admin-access.js"></script>
</body>
</html>
