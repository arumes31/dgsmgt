<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | DGSMgt</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
        .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--glass-border); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .main-content { padding: 32px; overflow-y: auto; }
        
        .admin-section { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px; margin-bottom: 32px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 16px; background: rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; }
        th { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        
        .badge { padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-admin { background: rgba(250, 204, 21, 0.1); color: #facc15; }
        .badge-user { background: rgba(148, 163, 184, 0.1); color: #cbd5e1; }
        
        nav a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94a3b8; text-decoration: none; border-radius: 12px; }
        nav a:hover, nav a.active { background: rgba(255,255,255,0.05); color: white; }
        nav a.active { background: var(--accent); color: white; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal { width: 100%; max-width: 500px; background: #0f172a; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .modal-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; max-height: 60vh; overflow-y: auto; }
        .modal-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end; gap: 12px; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div style="font-weight: 800; font-size: 20px; margin-bottom: 24px; color: var(--accent);">DGSMgt</div>
            <nav style="display: flex; flex-direction: column; gap: 4px;">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/admin.html" class="active">Administration</a>
            </nav>
            <div style="margin-top: auto;">
                <button onclick="DGSMgt.auth.logout()" class="btn btn-outline" style="width: 100%;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <h1>Administration</h1>

            <!-- Users -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Users</h2>
                    <button class="btn btn-primary btn-sm" onclick="openModal('userModal')">New User</button>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Actions</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </section>

            <!-- Servers -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Servers</h2>
                    <button class="btn btn-primary btn-sm" onclick="openModal('serverModal')">Create Server</button>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Image</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="serverTableBody"></tbody>
                </table>
            </section>

            <!-- Assignments -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>Assignments</h2>
                    <button class="btn btn-primary btn-sm" onclick="openAssignModal()">Assign Access</button>
                </div>
                <table>
                    <thead><tr><th>User</th><th>Server</th><th>Permissions</th><th>Actions</th></tr></thead>
                    <tbody id="assignTableBody"></tbody>
                </table>
            </section>

            <!-- Audit Logs -->
            <section class="admin-section">
                <h2>Audit Logs</h2>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
                        <tbody id="auditTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="userModal" class="modal-overlay" onclick="if(event.target === this) closeModal('userModal')">
        <div class="modal">
            <div class="modal-header"><h3>New User</h3></div>
            <form id="userForm">
                <div class="modal-body">
                    <div class="form-group"><label class="form-label">Username</label><input type="text" id="newUsername" class="form-input" required></div>
                    <div class="form-group"><label class="form-label">Password</label><input type="password" id="newPassword" class="form-input" required></div>
                    <label style="display: flex; gap: 8px; font-size: 14px;"><input type="checkbox" id="newIsAdmin"> Administrator</label>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal('userModal')" class="btn btn-outline">Cancel</button>
                    <button type="submit" id="userSubmitBtn" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div id="serverModal" class="modal-overlay" onclick="if(event.target === this) closeModal('serverModal')">
        <div class="modal">
            <div class="modal-header"><h3>Create Server</h3></div>
            <form id="serverForm">
                <div class="modal-body">
                    <div class="form-group"><label class="form-label">Name</label><input type="text" id="srvName" class="form-input" required></div>
                    <div class="form-group"><label class="form-label">Image</label><input type="text" id="srvImage" class="form-input" required></div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal('serverModal')" class="btn btn-outline">Cancel</button>
                    <button type="submit" id="serverSubmitBtn" class="btn btn-primary">Deploy</button>
                </div>
            </form>
        </div>
    </div>

    <div id="assignModal" class="modal-overlay" onclick="if(event.target === this) closeModal('assignModal')">
        <div class="modal">
            <div class="modal-header"><h3>Assign Access</h3></div>
            <form id="assignForm">
                <div class="modal-body">
                    <div class="form-group"><label class="form-label">User</label><select id="assignUserId" class="form-input" required></select></div>
                    <div class="form-group"><label class="form-label">Server</label><select id="assignServerId" class="form-input" required></select></div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal('assignModal')" class="btn btn-outline">Cancel</button>
                    <button type="submit" id="assignSubmitBtn" class="btn btn-primary">Assign</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        let allUsers = [];
        let allServers = [];

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function loadData() {
            try {
                const [users, servers, assignments, logs] = await Promise.all([
                    DGSMgt.api.get('/api/admin/users'),
                    DGSMgt.api.get('/api/admin/servers'),
                    DGSMgt.api.get('/api/admin/assignments'),
                    DGSMgt.api.get('/api/admin/audit-logs')
                ]);

                allUsers = users;
                allServers = servers;

                document.getElementById('userTableBody').innerHTML = users.map(u => `
                    <tr>
                        <td>${u.ID}</td>
                        <td>${u.username}</td>
                        <td><span class="badge ${u.is_admin ? 'badge-admin' : 'badge-user'}">${u.is_admin ? 'Admin' : 'User'}</span></td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${u.ID})">Delete</button></td>
                    </tr>
                `).join('');

                document.getElementById('serverTableBody').innerHTML = servers.map(s => `
                    <tr>
                        <td>${s.ID}</td>
                        <td>${s.name}</td>
                        <td style="font-family: monospace; font-size: 11px;">${s.image}</td>
                        <td>${s.status}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteServer(${s.ID})">Delete</button></td>
                    </tr>
                `).join('');

                document.getElementById('assignTableBody').innerHTML = assignments.map(a => {
                    const u = users.find(user => user.ID === a.user_id);
                    const s = servers.find(server => server.ID === a.server_id);
                    return `
                        <tr>
                            <td>${u ? u.username : a.user_id}</td>
                            <td>${s ? s.name : a.server_id}</td>
                            <td style="font-size: 11px; color: #94a3b8">S:${a.can_start} P:${a.can_stop} R:${a.can_restart} L:${a.can_view_logs}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="deleteAssign(${a.user_id}, ${a.server_id})">Remove</button></td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('auditTableBody').innerHTML = logs.map(l => `
                    <tr>
                        <td style="font-size: 11px; color: #64748b">${new Date(l.CreatedAt).toLocaleString()}</td>
                        <td>${l.username}</td>
                        <td><span style="font-weight: 600;">${l.action}</span></td>
                        <td style="font-size: 12px; color: #94a3b8">${l.details}</td>
                    </tr>
                `).join('');

                DGSMgt.ui.initTooltips();
            } catch (err) { console.error(err); }
        }

        async function deleteUser(id) { DGSMgt.ui.confirm('Delete user?', async () => { await DGSMgt.api.delete(`/api/admin/users/${id}`); loadData(); }); }
        async function deleteServer(id) { DGSMgt.ui.confirm('Warning: This will delete the server record AND the Docker container. Continue?', async () => { await DGSMgt.api.delete(`/api/admin/servers/${id}`); loadData(); }); }
        async function deleteAssign(uid, sid) { DGSMgt.ui.confirm('Remove assignment?', async () => { await DGSMgt.api.delete(`/api/admin/assignments/${uid}/${sid}`); loadData(); }); }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            await DGSMgt.api.post('/api/admin/users', {
                username: document.getElementById('newUsername').value,
                password: document.getElementById('newPassword').value,
                is_admin: document.getElementById('newIsAdmin').checked
            });
            closeModal('userModal'); loadData();
        };

        document.getElementById('serverForm').onsubmit = async (e) => {
            e.preventDefault();
            await DGSMgt.api.post('/api/admin/servers', {
                name: document.getElementById('srvName').value,
                image: document.getElementById('srvImage').value
            });
            closeModal('serverModal'); loadData();
        };

        function openAssignModal() {
            document.getElementById('assignUserId').innerHTML = allUsers.map(u => `<option value="${u.ID}">${u.username}</option>`).join('');
            document.getElementById('assignServerId').innerHTML = allServers.map(s => `<option value="${s.ID}">${s.name}</option>`).join('');
            openModal('assignModal');
        }

        document.getElementById('assignForm').onsubmit = async (e) => {
            e.preventDefault();
            await DGSMgt.api.post('/api/admin/assign', {
                user_id: parseInt(document.getElementById('assignUserId').value),
                server_id: parseInt(document.getElementById('assignServerId').value),
                can_start: true, can_stop: true, can_restart: true, can_view_logs: true
            });
            closeModal('assignModal'); loadData();
        };

        loadData();
    </script>
</body>
</html>
