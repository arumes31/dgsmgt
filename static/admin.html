<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | DGSMgt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="toggleSidebar"></div>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div style="font-weight: 800; font-size: 20px; margin-bottom: 24px; color: var(--accent); display: flex; justify-content: space-between; align-items: center;">
                DGSMgt
                <button class="mobile-menu-btn" data-action="toggleSidebar" style="border: none;" title="Close menu">
                    <svg width="20" height="20" aria-hidden="true"><use href="/icons.svg#icon-close"></use></svg>
                </button>
            </div>
            <nav style="display: flex; flex-direction: column; gap: 4px;">
                <a href="/dashboard.html">
                    <svg width="18" height="18" aria-hidden="true"><use href="/icons.svg#icon-dashboard"></use></svg>
                    Dashboard
                </a>
                <a href="/admin.html" class="active">
                    <svg width="18" height="18" aria-hidden="true"><use href="/icons.svg#icon-admin"></use></svg>
                    Administration
                </a>
            </nav>
            <div style="margin-top: auto;">
                <button data-action="logout" class="btn btn-outline" style="width: 100%;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="mobile-menu-btn" data-action="toggleSidebar" title="Open menu">
                        <svg width="20" height="20" aria-hidden="true"><use href="/icons.svg#icon-menu"></use></svg>
                    </button>
                    <div>
                        <h1 style="margin: 0; font-size: 24px; font-weight: 800;">System Administration</h1>
                        <p style="color: #94a3b8; margin-top: 4px; font-size: 14px;">Manage users, servers, and access controls.</p>
                    </div>
                </div>
                <input type="text" id="adminSearch" class="search-box" placeholder="Search everything..." data-input="filterTables">
            </div>

            <!-- User Management -->
            <div class="table-container">
                <div class="section-header">
                    <h2>User Management</h2>
                    <button class="btn btn-primary" data-action="showNewUserModal">
                        <svg width="16" height="16" aria-hidden="true"><use href="/icons.svg#icon-plus"></use></svg>
                        New User
                    </button>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Username</th><th>Role</th><th style="text-align: right;">Actions</th></tr></thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>

            <!-- Server Management -->
            <div class="table-container">
                <div class="section-header">
                    <h2>Server Management</h2>
                    <button class="btn btn-primary" data-action="showNewServerModal">
                        <svg width="16" height="16" aria-hidden="true"><use href="/icons.svg#icon-plus"></use></svg>
                        Create Server
                    </button>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Name</th><th>Image</th><th>Status</th><th style="text-align: right;">Actions</th></tr></thead>
                    <tbody id="serverTableBody"></tbody>
                </table>
            </div>

            <!-- Assignments -->
            <div class="table-container">
                <div class="section-header">
                    <h2>Server Assignments</h2>
                    <button class="btn btn-primary" data-action="showAssignModal">
                        <svg width="16" height="16" aria-hidden="true"><use href="/icons.svg#icon-plus"></use></svg>
                        Assign Server
                    </button>
                </div>
                <table>
                    <thead><tr><th>User</th><th>Server</th><th>Permissions</th><th style="text-align: right;">Actions</th></tr></thead>
                    <tbody id="assignTableBody"></tbody>
                </table>
            </div>
            
            <!-- Audit Logs -->
            <div class="table-container">
                <div class="section-header">
                    <h2>Audit Logs</h2>
                </div>
                <div style="max-height: 400px; overflow-y: auto;" class="custom-scrollbar">
                    <table>
                        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
                        <tbody id="auditTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
