<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DGSMgt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .stats-summary { display: flex; gap: 24px; margin-bottom: 32px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 20px 32px; border-radius: 20px; }
        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-value { font-size: 24px; font-weight: 800; color: white; }
        .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
        
        .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
        .server-card { padding: 24px; border-radius: 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); transition: all 0.2s; display: flex; flex-direction: column; }
        .server-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
        
        .console-output { height: 400px; font-family: monospace; font-size: 13px; color: #d1d5db; overflow-y: auto; background: #080808; padding: 16px; border-radius: 12px; border: 1px solid #222; }
        .chart-container { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); height: 140px; position: relative; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="toggleSidebar"></div>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div style="font-weight: 800; font-size: 20px; margin-bottom: 24px; color: var(--accent); display: flex; justify-content: space-between; align-items: center;">
                DGSMgt
                <button class="mobile-menu-btn" data-action="toggleSidebar" style="border: none;" title="Close menu">
                    <svg width="20" height="20" aria-hidden="true"><use href="/icons.svg#icon-close"></use></svg>
                </button>
            </div>
            <nav style="display: flex; flex-direction: column; gap: 4px;">
                <a href="/dashboard.html" class="active">
                    <svg width="18" height="18" aria-hidden="true"><use href="/icons.svg#icon-dashboard"></use></svg>
                    Dashboard
                </a>
                <a href="#" data-action="changePassword">
                    <svg width="18" height="18" aria-hidden="true"><use href="/icons.svg#icon-shield"></use></svg>
                    Security
                </a>
                <a href="/admin.html" id="adminLink" style="display: none;">
                    <svg width="18" height="18" aria-hidden="true"><use href="/icons.svg#icon-admin"></use></svg>
                    Administration
                </a>
            </nav>
            <div style="margin-top: auto;">
                <div id="userDisplay" style="font-size: 13px; color: #64748b; margin-bottom: 12px; padding: 0 12px;"></div>
                <button data-action="logout" class="btn btn-outline" style="width: 100%;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="mobile-menu-btn" data-action="toggleSidebar" title="Open menu">
                        <svg width="20" height="20" aria-hidden="true"><use href="/icons.svg#icon-menu"></use></svg>
                    </button>
                    <h1 style="margin: 0;">Server Overview</h1>
                </div>
                <input type="text" id="serverSearch" class="search-box" placeholder="Search servers..." data-input="filterServers">
            </div>

            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-label">Total Servers</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Running</span>
                    <span id="stat-running" class="stat-value" style="color: #4ade80;">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Offline</span>
                    <span id="stat-offline" class="stat-value" style="color: #f87171;">0</span>
                </div>
            </div>

            <div id="serverGrid" class="server-grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #64748b;"><span class="spinner"></span> Loading your infrastructure...</div>
            </div>
        </main>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
