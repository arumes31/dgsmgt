<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Servers | DGSMgt</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/app2.css">
</head>
<body>
<div class="mesh-bg"></div>
<div class="layout">
  <aside class="sidebar">
    <h2 class="text-gradient" style="font-size:22px;margin-bottom:32px">⚡ DGSMgt</h2>
    <nav style="display:flex;flex-direction:column;gap:6px" id="nav"></nav>
    <div id="folders" style="margin-top:28px"></div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <div class="flex">
        <button class="btn btn-outline btn-icon" id="btn-theme" title="Theme">🌓</button>
        <button class="btn btn-outline btn-icon" id="btn-lang" title="Language">🌐</button>
        <button class="btn btn-outline btn-icon" onclick="App.showHelp()" title="Shortcuts (?)">⌨️</button>
      </div>
      <button class="btn btn-outline" id="btn-logout">Logout</button>
    </div>
  </aside>

  <main class="main-content" id="main">
    <!-- List view -->
    <section id="view-list">
      <div class="topbar">
        <h1 style="font-size:26px">Servers</h1>
        <input class="form-input searchbox" id="search" placeholder="Search…  ( / )">
        <select class="form-input" id="sort" style="width:auto">
          <option value="name">Sort: Name</option>
          <option value="status">Sort: Status</option>
          <option value="folder">Sort: Folder</option>
        </select>
        <button class="btn btn-outline btn-icon" id="btn-viewmode" title="Grid/List">🔲</button>
        <span id="bell-mount"></span>
        <a class="btn btn-outline" href="/profile.html">👤</a>
      </div>
      <div id="bulkbar" class="glass hidden" style="border-radius:var(--radius-sm);padding:12px 20px;margin-bottom:20px;display:flex;gap:12px;align-items:center">
        <b id="bulk-count"></b>
        <button class="btn btn-outline" data-bulk="start">▶ Start</button>
        <button class="btn btn-outline" data-bulk="restart">⟳ Restart</button>
        <button class="btn btn-danger" data-bulk="stop">■ Stop</button>
        <button class="btn btn-outline" id="bulk-clear">Clear</button>
      </div>
      <div class="grid-cards" id="cards">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>

    <!-- Detail view -->
    <section id="view-detail" class="hidden">
      <div class="breadcrumbs"><span id="crumb-back">← Servers</span></div>
      <div class="detail-head">
        <div class="icon-emoji" id="d-icon">🎮</div>
        <div class="grow">
          <h1 style="font-size:24px" id="d-name"></h1>
          <div class="flex flex-wrap" style="margin-top:4px">
            <span class="status-indicator" id="d-status"><span class="status-dot"></span><span></span></span>
            <span class="small" id="d-uptime"></span>
            <span class="small" id="d-avail"></span>
          </div>
        </div>
        <div class="flex flex-wrap" id="d-actions"></div>
      </div>
      <div class="flex flex-wrap mb" id="d-connect"></div>
      <div class="tabs" id="d-tabs"></div>
      <div id="tab-content"></div>
    </section>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/dashboard-tabs.js"></script>
<script src="/js/dashboard-settings.js"></script>
</body>
</html>
