<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | DGSMgt</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
        .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--glass-border); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .main-content { padding: 32px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        
        .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
        .server-card { padding: 24px; border-radius: 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); transition: all 0.2s; }
        .server-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
        
        .status-badge { padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-running { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .status-stopped { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        
        .console-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 40px; }
        .console-window { width: 100%; max-width: 1000px; height: 80vh; background: #000; border-radius: 16px; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
        .console-header { padding: 16px 24px; background: #111; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .console-output { flex-grow: 1; padding: 20px; font-family: monospace; font-size: 13px; color: #d1d5db; overflow-y: auto; background: #080808; }
        
        nav a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94a3b8; text-decoration: none; border-radius: 12px; }
        nav a:hover, nav a.active { background: rgba(255,255,255,0.05); color: white; }
        nav a.active { background: var(--accent); color: white; }

        .search-box { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px 16px; color: white; width: 300px; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div style="font-weight: 800; font-size: 20px; margin-bottom: 24px; color: var(--accent);">DGSMgt</div>
            <nav style="display: flex; flex-direction: column; gap: 4px;">
                <a href="/dashboard.html" class="active">Dashboard</a>
                <a href="#" onclick="DGSMgt.ui.showChangePassword(); return false;">Security</a>
                <a href="/admin.html" id="adminLink" style="display: none;">Administration</a>
            </nav>
            <div style="margin-top: auto;">
                <div id="userDisplay" style="font-size: 13px; color: #64748b; margin-bottom: 12px; padding: 0 12px;"></div>
                <button onclick="DGSMgt.auth.logout()" class="btn btn-outline" style="width: 100%;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1 style="margin: 0;">My Servers</h1>
                <input type="text" id="serverSearch" class="search-box" placeholder="Search servers..." oninput="filterServers()">
            </div>

            <div id="serverGrid" class="server-grid">
                <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #64748b;"><span class="spinner"></span> Loading servers...</div>
            </div>
        </main>
    </div>

    <div id="consoleOverlay" class="console-overlay" onclick="if(event.target === this) closeConsole()">
        <div class="console-window">
            <div class="console-header">
                <span id="consoleTitle" style="font-weight: 600;">Console</span>
                <button onclick="closeConsole()" class="btn btn-outline btn-sm">Close</button>
            </div>
            <div id="consoleOutput" class="console-output custom-scrollbar"></div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        let allServers = [];
        let currentWs = null;

        async function loadDashboard() {
            try {
                const [me, servers] = await Promise.all([
                    DGSMgt.api.get('/api/me'),
                    DGSMgt.api.get('/api/my-servers')
                ]);

                if (me) {
                    document.getElementById('userDisplay').textContent = `Logged in as ${me.username}`;
                    if (me.is_admin) document.getElementById('adminLink').style.display = 'flex';
                }

                allServers = servers || [];
                filterServers();
            } catch (err) { DGSMgt.ui.toast('Error loading dashboard', 'error'); }
        }

        function renderServers(servers) {
            const grid = document.getElementById('serverGrid');
            if (servers.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#64748b;">No servers found.</div>';
                return;
            }
            grid.innerHTML = servers.map(s => {
                const isRunning = s.status.toLowerCase().includes('up');
                return `
                <div class="server-card">
                    <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:16px;">
                        <div>
                            <h3 style="margin:0;">${s.name}</h3>
                            <div style="font-size:11px; color:#64748b; font-family:monospace;">${s.id.substring(0,12)}</div>
                        </div>
                        <span class="status-badge ${isRunning ? 'status-running' : 'status-stopped'}">${s.status}</span>
                    </div>
                    <div style="font-size:13px; color:#94a3b8; margin-bottom:20px;">
                        <div>Image: ${s.image}</div>
                        <div>Uptime: ${s.uptime || 'N/A'}</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        ${isRunning 
                            ? `<button onclick="handleAction('${s.id}', 'stop', this)" class="btn btn-danger btn-sm" style="flex:1">Stop</button>`
                            : `<button onclick="handleAction('${s.id}', 'start', this)" class="btn btn-primary btn-sm" style="flex:1">Start</button>`
                        }
                        <button onclick="handleAction('${s.id}', 'restart', this)" class="btn btn-outline btn-sm">Restart</button>
                        <button onclick="openConsole('${s.id}', '${s.name}')" class="btn btn-outline btn-sm">Logs</button>
                        ${isRunning ? `<button onclick="openMetrics('${s.id}', '${s.name}')" class="btn btn-outline btn-sm">Metrics</button>` : ''}
                    </div>
                </div>`;
            }).join('');
            DGSMgt.ui.initTooltips();
        }

        function filterServers() {
            const query = document.getElementById('serverSearch').value.toLowerCase();
            const filtered = allServers.filter(s => s.name.toLowerCase().includes(query) || s.id.toLowerCase().includes(query));
            renderServers(filtered);
        }

        async function handleAction(id, type, btn) {
            if (type === 'stop' || type === 'restart') {
                DGSMgt.ui.confirm(`Are you sure you want to ${type} this server?`, () => executeAction(id, type, btn));
            } else {
                executeAction(id, type, btn);
            }
        }

        async function executeAction(id, type, btn) {
            const old = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<span class="spinner" style="margin:0"></span>';
            try {
                await DGSMgt.api.post(`/api/action/${id}/${type}`, {});
                DGSMgt.ui.toast(`Action ${type} successful`, 'success');
                setTimeout(loadDashboard, 1000);
            } catch (err) { DGSMgt.ui.toast(err.message, 'error'); btn.disabled = false; btn.innerHTML = old; }
        }

        function openConsole(id, name) {
            const overlay = document.getElementById('consoleOverlay');
            const output = document.getElementById('consoleOutput');
            document.getElementById('consoleTitle').textContent = `Logs: ${name}`;
            overlay.style.display = 'flex'; output.textContent = 'Connecting...\n';
            if (currentWs) currentWs.close();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            currentWs = new WebSocket(`${protocol}//${window.location.host}/api/logs/${id}?token=${DGSMgt.api.token()}`);
            currentWs.onmessage = (e) => { output.textContent += e.data; output.scrollTop = output.scrollHeight; };
            currentWs.onerror = () => { DGSMgt.ui.toast('Console connection error', 'error'); };
        }

        function closeConsole() { if(currentWs) currentWs.close(); document.getElementById('consoleOverlay').style.display='none'; }

        // Metrics Logic
        let metricsWs = null;
        let cpuData = [];
        let ramData = [];
        const maxDataPoints = 30;

        function openMetrics(id, name) {
            const existing = document.getElementById('metricsOverlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'metricsOverlay';
            overlay.className = 'console-overlay';
            overlay.style.display = 'flex';
            overlay.style.zIndex = '101';
            overlay.onclick = (e) => { if (e.target === overlay) closeMetrics(); };

            overlay.innerHTML = `
                <div class="console-window" style="height: 60vh; max-width: 800px; background: #0f172a;">
                    <div class="console-header">
                        <span style="font-weight: 600;">Metrics: ${name}</span>
                        <button onclick="closeMetrics()" class="btn btn-outline btn-sm">Close</button>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 24px; padding: 24px; flex-grow: 1; overflow-y: auto;">
                        <div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #94a3b8; font-size: 14px; font-weight: 600;">CPU Usage</span>
                                <span id="cpuText" style="color: #4ade80; font-family: monospace; font-weight: 600;">0.00%</span>
                            </div>
                            <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); height: 160px; position: relative;">
                                <canvas id="cpuCanvas" style="width: 100%; height: 100%;"></canvas>
                            </div>
                        </div>
                        <div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #94a3b8; font-size: 14px; font-weight: 600;">RAM Usage</span>
                                <span id="ramText" style="color: #60a5fa; font-family: monospace; font-weight: 600;">0 MB / 0 MB (0.00%)</span>
                            </div>
                            <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); height: 160px; position: relative;">
                                <canvas id="ramCanvas" style="width: 100%; height: 100%;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            cpuData = new Array(maxDataPoints).fill(0);
            ramData = new Array(maxDataPoints).fill(0);
            
            initCharts();

            if (metricsWs) metricsWs.close();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            metricsWs = new WebSocket(`${protocol}//${window.location.host}/api/metrics/${id}?token=${DGSMgt.api.token()}`);
            
            metricsWs.onmessage = (e) => {
                try {
                    const stats = JSON.parse(e.data);
                    
                    // Calculate CPU %
                    const cpuDelta = stats.cpu_stats.cpu_usage.total_usage - stats.precpu_stats.cpu_usage.total_usage;
                    const systemDelta = stats.cpu_stats.system_cpu_usage - stats.precpu_stats.system_cpu_usage;
                    let cpuPercent = 0.0;
                    if (systemDelta > 0.0 && cpuDelta > 0.0) {
                        cpuPercent = (cpuDelta / systemDelta) * stats.cpu_stats.online_cpus * 100.0;
                    }
                    
                    // Calculate RAM
                    const memUsage = stats.memory_stats.usage - (stats.memory_stats.stats?.cache || 0);
                    const memLimit = stats.memory_stats.limit;
                    let memPercent = 0.0;
                    if (memLimit > 0) {
                        memPercent = (memUsage / memLimit) * 100.0;
                    }

                    document.getElementById('cpuText').textContent = `${cpuPercent.toFixed(2)}%`;
                    document.getElementById('ramText').textContent = `${(memUsage / 1024 / 1024).toFixed(1)} MB / ${(memLimit / 1024 / 1024 / 1024).toFixed(2)} GB (${memPercent.toFixed(2)}%)`;

                    cpuData.push(Math.min(cpuPercent, 100));
                    cpuData.shift();
                    ramData.push(Math.min(memPercent, 100));
                    ramData.shift();

                    drawChart('cpuCanvas', cpuData, '#4ade80', 'rgba(74, 222, 128, 0.1)');
                    drawChart('ramCanvas', ramData, '#60a5fa', 'rgba(96, 165, 250, 0.1)');
                } catch (err) {}
            };
        }

        function closeMetrics() {
            if (metricsWs) { metricsWs.close(); metricsWs = null; }
            const overlay = document.getElementById('metricsOverlay');
            if (overlay) overlay.remove();
        }

        function initCharts() {
            drawChart('cpuCanvas', cpuData, '#4ade80', 'rgba(74, 222, 128, 0.1)');
            drawChart('ramCanvas', ramData, '#60a5fa', 'rgba(96, 165, 250, 0.1)');
        }

        function drawChart(canvasId, data, strokeColor, fillColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            // Handle high DPI displays
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            
            const ctx = canvas.getContext('2d');
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const width = rect.width;
            const height = rect.height;
            const padding = 10;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;
            const stepX = chartWidth / (maxDataPoints - 1);

            ctx.clearRect(0, 0, width, height);

            // Draw Grid
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<=4; i++) {
                const y = padding + (chartHeight / 4) * i;
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
            }
            ctx.stroke();

            // Draw Line
            ctx.beginPath();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            
            data.forEach((val, i) => {
                const x = padding + i * stepX;
                const y = height - padding - (val / 100) * chartHeight;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Fill Area
            ctx.lineTo(width - padding, height - padding);
            ctx.lineTo(padding, height - padding);
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('metricsOverlay')) {
                drawChart('cpuCanvas', cpuData, '#4ade80', 'rgba(74, 222, 128, 0.1)');
                drawChart('ramCanvas', ramData, '#60a5fa', 'rgba(96, 165, 250, 0.1)');
            }
        });

        loadDashboard();
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
