<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | DGSMgt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        body { background: #050505; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: white; font-family: system-ui; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        window.onload = () => {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.replace('/dashboard.html');
            } else {
                window.location.replace('/login.html');
            }
        };
    </script>
</head>
<body>
    <div class="spinner"></div>
</body>
</html>
