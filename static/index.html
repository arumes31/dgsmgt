<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGSMgt | Initializing...</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
        :root { --bg: #020617; --accent: #3b82f6; }
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #020617 80%);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            color: white; 
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 32px;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }
        .spinner { 
            width: 48px; 
            height: 48px; 
            border: 3px solid rgba(255,255,255,0.03); 
            border-radius: 50%; 
            border-top-color: var(--accent); 
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite; 
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        window.onload = () => {
            setTimeout(() => {
                const token = localStorage.getItem('token');
                window.location.replace(token ? '/dashboard.html' : '/login.html');
            }, 500);
        };
    </script>
</head>
<body>
    <div class="logo">DGSMgt</div>
    <div class="spinner"></div>
</body>
</html>
