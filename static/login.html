<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DGSMgt Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .login-page {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            overflow: hidden;
        }

        .login-bg-media {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            filter: blur(5px);
            z-index: 0;
        }

        .login-mesh {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.2) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.2) 0%, transparent 50%);
        }

        .login-card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 24px;
        }

        .premium-card {
            padding: 48px;
            border-radius: var(--radius-lg);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-container {
            background: var(--accent-gradient);
            padding: 2px;
            border-radius: 20px;
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            box-shadow: 0 20px 40px -10px var(--accent-glow);
        }

        .logo-inner {
            background: #0f172a;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-title {
            font-size: 32px;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtitle {
            text-align: center;
            color: var(--fg-secondary);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <!-- Local Premium Assets -->
        <img src="/assets/bg.png" class="login-bg-media" alt="">
        <div class="login-mesh"></div>

        <div class="login-card-container">
            <div class="premium-card">
                <div class="reveal-stagger">
                    <div class="logo-container">
                        <div class="logo-inner">
                            <img src="/assets/logo.png" class="logo-img" alt="DGSMgt Logo">
                        </div>
                    </div>

                    <h1 class="login-title text-gradient">DGSMgt Portal</h1>
                    <p class="login-subtitle">Secure Instance Management</p>

                    <form id="loginForm" style="display: flex; flex-direction: column; gap: 24px;">
                        <div class="form-group">
                            <label class="form-label" for="username">Identity</label>
                            <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="username">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Security Key</label>
                            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 16px; margin-top: 8px;">
                            <span>Authenticate</span>
                        </button>
                    </form>

                    <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--glass-border); text-align: center;">
                        <span class="text-muted" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;">
                            DGSMgt Core v1.2 &bull; SSL Secured
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const btn = document.getElementById('submitBtn');
            DGSMgt.ui.setLoading('submitBtn', true, 'Authenticating...');

            try {
                await DGSMgt.auth.login(username, password);
                DGSMgt.ui.toast('Authentication successful', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 800);
            } catch (err) {
                DGSMgt.ui.toast(err.message || 'Access Denied', 'error');
                DGSMgt.ui.setLoading('submitBtn', false);
            }
        });
    </script>
</body>
</html>
